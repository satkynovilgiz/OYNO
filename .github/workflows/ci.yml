# Lightweight validation on every push / pull request to main:
# install exactly what the lockfile pins, typecheck, run the Jest suite.
# No EAS or native (iOS/Android) builds here - those stay manual.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders only - tests mock the Supabase client and never hit the
      # network. Real values live in EAS environments, never in the repo.
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      EXPO_PUBLIC_SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --silent --ci
